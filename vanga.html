<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MangaSite</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #111;
      color: #fff;
      padding: 20px;
    }

    header {
      text-align: center;
      padding: 40px 20px;
    }

    header h1 {
      font-size: 3em;
      color: #ff3e6c;
    }

    .card {
      background-color: #1e1e1e;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      transition: transform 0.3s;
    }

    .card:hover {
      transform: scale(1.03);
    }

    .card-content {
      padding: 15px;
    }

    .card-content h2 {
      font-size: 1.4em;
      margin-bottom: 10px;
      color: #ff3e6c;
    }

    .card-content p {
      font-size: 0.95em;
      color: #ccc;
      margin-bottom: 15px;
    }

    .read-button {
      background-color: #ff3e6c;
      color: white;
      padding: 10px 18px;
      border: none;
      border-radius: 20px;
      text-decoration: none;
      font-weight: bold;
      transition: background 0.3s;
    }

    .read-button:hover {
      background-color: #e62b56;
    }

    footer {
      text-align: center;
      margin-top: 40px;
      font-size: 0.9em;
      opacity: 0.6;
    }
  </style>
</head>
<body>

  <header>
    <h1>Моя Манга Коллекция</h1>
  </header>

  <section class="gallery">
    <div class="card">
      <!-- Удалено изображение -->
      <div class="card-content">
        <h2>Личности силы</h2>
        <p>История маленького мальчика который родился с 3 личностями</p>
        <a href="file:///C:/Users/Admin/Desktop/vangalic.html#chapter1" class="read-button">Читать</a>
      </div>
    </div>
  </section>

  <footer>
    &copy; 2025 MangaSite. Все права защищены.
  </footer>

</body>
</html>
